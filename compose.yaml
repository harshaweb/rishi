services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: harshaweb
      POSTGRES_USER: harshaweb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in your local environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harshaweb -d harshaweb"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
